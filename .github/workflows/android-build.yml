name: Android Build

on:
  push:
    paths: ["mobile/**", ".github/workflows/android-build.yml"]
  pull_request:
    paths: ["mobile/**"]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android project files (only if missing)
        run: |
          if [ ! -d android ]; then
            flutter create --platforms=android --org com.hamwhatsapp --project-name hamwhatsapp .
          fi
          sed -i 's/android:label="[^"]*"/android:label="HamWhatsApp"/' android/app/src/main/AndroidManifest.xml

      - run: flutter pub get

      - name: Generate launcher icons from the official logo
        run: dart run flutter_launcher_icons

      - name: Format check (non-blocking in Milestone 1)
        run: dart format --output=none --set-exit-if-changed lib test
        continue-on-error: true

      - run: flutter analyze --no-fatal-infos

      - run: flutter test

      - run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: hamwhatsapp-apk
          path: mobile/build/app/outputs/flutter-apk/app-release.apk
